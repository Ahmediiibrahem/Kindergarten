<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>حضانة سنابل | تطبيق المعلمة</title>
  <!-- خط كايرو المريح للعين -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- ملف التنسيق -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 1. شاشة تسجيل الدخول -->
  <section id="loginScreen" class="login-wrap">
    <div class="welcome">
      <h1>يوم مليان تعلُّم<br>ولعب واهتمام 🌱</h1>
      <p>لوحة المعلمة اليومية لتنظيم الحضور والأنشطة والانصراف بكل بساطة وسرعة.</p>
      <div class="welcome-art"><span>🧸</span><span>🎨</span><span>🍎</span><span>📚</span></div>
    </div>
    <form id="loginForm" class="login-card">
      <h2>تسجيل دخول المعلمة</h2>
      <div class="field">
        <label for="username">اسم المستخدم</label>
        <input id="username" autocomplete="username" placeholder="مثال: fatima" required>
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" placeholder="••••••••" required>
      </div>
      <div id="loginError" style="color:var(--danger); font-size:13px; min-height:18px;"></div>
      <button class="btn full" type="submit">دخول اللوحة ←</button>
      <div class="demo-note">حساب تجريبي: <b>fatima</b> / كلمة المرور: <b>02082000</b></div>
    </form>
  </section>

  <!-- 2. شاشة إعداد اليوم وسيلفي الفصل -->
  <section id="setupScreen" class="app-main hidden">
    <div class="login-card" style="max-width:680px">
      <h2>تجهيز يومك يا فاطمة 👋</h2>
      <form id="setupForm">
        <div class="camera-box">
          <div id="selfiePlaceholder" class="selfie-placeholder">🤳🏻</div>
          <img id="selfiePreview" class="selfie-preview hidden" alt="سيلفي المعلمة">
          <input id="selfieInput" type="file" accept="image/*" capture="user" class="hidden">
          <button type="button" id="takeSelfie" class="btn secondary">التقاط سيلفي الحضور</button>
        </div>
        <div class="field">
          <label for="classSelect">الفصل</label>
          <select id="classSelect" required>
            <option value="">اختاري الفصل</option>
            <option>البراعم</option>
            <option>النجوم</option>
            <option>الفراشات</option>
          </select>
        </div>
        <div class="field">
          <label for="dayDate">التاريخ</label>
          <input id="dayDate" type="date" required>
        </div>
        <button class="btn full" type="submit">تأكيد وبدء اليوم</button>
      </form>
    </div>
  </section>

  <!-- 3. لوحة تشغيل التطبيق (Dashboard Shell) -->
  <section id="appScreen" class="app-shell hidden">
    <aside class="sidebar">
      <div style="font-weight:800; font-size:20px; color:var(--primary); margin-bottom:20px;">🌱 سنابل</div>
      <nav style="display:flex; flex-direction:column; gap:6px;">
        <button class="side-link active" data-tab="children"><span class="nav-emoji">🧸</span> الأطفال</button>
        <button class="side-link" data-tab="attendance"><span class="nav-emoji">🌈</span> الحضور</button>
        <button class="side-link" data-tab="activities"><span class="nav-emoji">🎨</span> الأنشطة</button>
        <button class="side-link" data-tab="dismissal"><span class="nav-emoji">🎒</span> الانصراف</button>
      </nav>
      <div style="margin-top:auto; padding-top:20px;">
        <button id="logoutBtn" class="btn secondary" style="width:100%">خروج</button>
      </div>
    </aside>

    <main class="app-main">
      <header style="margin-bottom:24px;">
        <h1 style="margin:0 0 4px;" id="welcomeTitle">أهلاً يا فاطمة!</h1>
        <small id="classLabel" style="color:var(--muted);"></small>
      </header>

      <section class="stats">
        <div class="stat"><span style="font-size:24px">🧒</span><div><strong id="totalCount">0</strong><br><small>الإجمالي</small></div></div>
        <div class="stat"><span style="font-size:24px">🌞</span><div><strong id="presentCount">0</strong><br><small>حاضر</small></div></div>
        <div class="stat"><span style="font-size:24px">🚌</span><div><strong id="waitingCount">0</strong><br><small>لم يصل</small></div></div>
        <div class="stat"><span style="font-size:24px">🎒</span><div><strong id="leftCount">0</strong><br><small>انصرف</small></div></div>
      </section>

      <section id="tabContent"></section>
    </main>
  </section>

  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden"></div>

  <!-- ربط السكربتات بالترتيب الصحيح -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
